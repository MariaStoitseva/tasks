
{% extends 'base.html' %}
{% load static %}

{% block title %}Calendar | SmartTask{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'planner/css/calendar.css' %}">
{% endblock %}

{% block content %}

<div class="mb-4">
    <h1 class="fw-bold mb-2">Calendar</h1>
    <p class="text-muted mb-0">
        Keep track of your deadlines and important dates.
    </p>
</div>

<div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4">

        <div class="d-flex flex-wrap gap-3 mb-4">
            <div class="d-flex align-items-center gap-2">
                <span class="calendar-dot task-dot"></span>
                <span class="text-muted small">Tasks</span>
            </div>

            <div class="d-flex align-items-center gap-2">
                <span class="calendar-dot holiday-dot"></span>
                <span class="text-muted small">Public Holidays</span>
            </div>
        </div>

        <div id="calendar"></div>

    </div>
</div>

{% endblock %}

{% block extra_js %}

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {

    const calendarElement = document.getElementById('calendar');

    const calendar = new FullCalendar.Calendar(calendarElement, {

        initialView: 'dayGridMonth',
        height: 'auto',
        firstDay: 1,
        locale: 'en',
        dayMaxEvents: 3,
        
        // Weekly calendar settings
        slotMinTime: '07:00:00',
        slotMaxTime: '22:00:00',
        slotDuration: '01:00:00',
        slotLabelInterval: '01:00:00',
        slotLabelFormat: {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        },
        
        scrollTime: '08:00:00',

        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,listMonth'
        },

        buttonText: {
            today: 'Today',
            month: 'Month',
            week: 'Week',
            list: 'List'
        },

        eventSources: [

            // Tasks from PostgreSQL
            {
                events: [
                    {% for task in tasks %}
                    {
                        title: '{{ task.title|escapejs }}',
                        start: '{{ task.deadline|date:"Y-m-d\\TH:i:s" }}',
                        url: '{% url "edit_task" task.pk %}',
                        classNames: ['task-event']
                    },
                    {% endfor %}
                ]
            },

            // Bulgarian public holidays
            {
                events: function(info, successCallback, failureCallback) {

                    const startYear = info.start.getFullYear();
                    const endYear = info.end.getFullYear();

                    const years = [];

                    for (let year = startYear; year <= endYear; year++) {
                        years.push(year);
                    }

                    Promise.all(
                        years.map(year =>
                            fetch(
                                `https://date.nager.at/api/v3/PublicHolidays/${year}/BG`
                            ).then(response => {
                                if (!response.ok) {
                                    throw new Error('Could not load holidays.');
                                }
                                return response.json();
                            })
                        )
                    )
                    .then(results => {

                        const holidays = results.flat().map(holiday => ({
                            title: holiday.localName,
                            start: holiday.date,
                            allDay: true,
                            classNames: ['holiday-event']
                        }));

                        successCallback(holidays);
                    })
                    .catch(error => {
                        console.error('Holiday API error:', error);
                        failureCallback(error);
                    });
                }
            }
        ],

        eventClick: function(info) {
            if (info.event.url) {
                info.jsEvent.preventDefault();
                window.location.href = info.event.url;
            }
        }
    });

    calendar.render();
});
</script>

{% endblock %}
